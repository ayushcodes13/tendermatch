name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run deterministic regression suite
        run: >-
          python -m pytest -q
          tests/test_matching_dataset.py
          tests/test_matching_evaluation.py
          tests/test_matching_regressions.py
          tests/test_specific_tender.py
