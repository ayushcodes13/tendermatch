name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy requests beautifulsoup4 python-dotenv 'pypdf>=6.21,<7'

      - name: Run deterministic regression suite
        run: >-
          python -m pytest -q
          tests/test_matching_dataset.py
          tests/test_matching_evaluation.py
          tests/test_matching_regressions.py
          tests/test_manufacturer_profile_validation.py
          tests/test_domain_compatibility.py
          tests/test_matching_explanation.py
          tests/test_matching_thresholds.py
          tests/test_threshold_evaluation.py
          tests/test_db_identity.py
          tests/test_scraper_identity_links.py
          tests/test_tender_amendments.py
          tests/test_email_config.py
          tests/test_email_sender.py
          tests/test_email_outbox.py
          tests/test_digest_formatter.py
          tests/test_pipeline_digest.py
          tests/test_specific_tender.py
          tests/test_document_retrieval.py
          tests/test_document_extraction.py
          tests/test_salesperson_feedback.py
          tests/test_feedback_export.py
          tests/test_feedback_adjudication.py
          tests/test_pipeline_run_ledger.py
          tests/test_safe_error_logging.py
          tests/test_deployment_smoke.py
