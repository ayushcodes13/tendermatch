name: Migrate TenderMatch database cache

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: tender-pipeline
  cancel-in-progress: false
  queue: max

jobs:
  migrate-db-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore legacy plaintext database cache
        id: restore-legacy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/tenders.db
          key: tender-db-cache-${{ github.run_id }}
          restore-keys: |
            tender-db-cache-

      - name: Require a legacy cache to migrate
        run: |
          if [ ! -s data/tenders.db ]; then
            echo "::error::No legacy TenderMatch database cache was found. Refusing to create an empty replacement."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=44,<47'

      - name: Encrypt and integrity-check restored database
        env:
          TENDERMATCH_DB_CACHE_KEY: ${{ secrets.TENDERMATCH_DB_CACHE_KEY }}
        run: python -m data.cache_encryption encrypt data/tenders.db data/tenders.db.enc

      - name: Save authenticated encrypted cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/tenders.db.enc
          key: tender-db-encrypted-v1-${{ github.run_id }}

      - name: Delete legacy plaintext database caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          cache_ids="$(gh api --paginate "repos/${GH_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key | startswith("tender-db-cache-")) | .id')"
          for cache_id in ${cache_ids}; do
            gh api --method DELETE "repos/${GH_REPOSITORY}/actions/caches/${cache_id}" >/dev/null
          done
