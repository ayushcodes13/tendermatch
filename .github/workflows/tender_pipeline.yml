name: Tender Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tender-pipeline
  cancel-in-progress: false
  queue: max

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore encrypted tender DB cache
        id: restore-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/tenders.db.enc
          key: tender-db-encrypted-v1-${{ github.run_id }}
          restore-keys: |
            tender-db-encrypted-v1-

      - name: Require migrated encrypted state
        run: |
          if [ ! -s data/tenders.db.enc ]; then
            echo "::error::No encrypted TenderMatch database cache was found. Complete the one-time cache migration before running the pipeline."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decrypt and integrity-check tender database
        env:
          TENDERMATCH_DB_CACHE_KEY: ${{ secrets.TENDERMATCH_DB_CACHE_KEY }}
        run: python -m data.cache_encryption decrypt data/tenders.db.enc data/tenders.db

      - name: Run Tender Pipeline
        env:
          SENDER_EMAIL: ${{ secrets.EMAIL_USER }}
          SENDER_PASSWORD: ${{ secrets.EMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python -m pipeline.run

      - name: Encrypt tender DB before caching
        env:
          TENDERMATCH_DB_CACHE_KEY: ${{ secrets.TENDERMATCH_DB_CACHE_KEY }}
        run: python -m data.cache_encryption encrypt data/tenders.db data/tenders.db.enc

      - name: Save encrypted tender DB cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/tenders.db.enc
          key: tender-db-encrypted-v1-${{ github.run_id }}
